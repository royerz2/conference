<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioMastermind</title>
<style>
:root{color-scheme:light;--ink:#20252a;--soft:#55625f;--bg:#f4f6f2;--paper:#fff;--line:#d8e0d9;--green:#204d42;--mint:#e1eee6;--warn:#6c451a;--sand:#fff1d8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "DM Sans",system-ui,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
a{color:var(--green);text-underline-offset:4px}
:focus-visible{outline:3px solid #7d9959;outline-offset:3px}
.mast{background:#153b34;color:white}
.mast-inner{max-width:1220px;margin:auto;padding:35px 30px 39px;display:flex;align-items:end;justify-content:space-between;gap:20px}
h1,h2,h3,p{margin:0}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:500;font-size:clamp(38px,6vw,66px);line-height:1.05;letter-spacing:-.035em}
.mast p{color:#d0e1d8;margin-top:12px;max-width:620px}
.mode{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:#2c5549;color:#eef6ef;padding:5px 11px;border-radius:30px;font-size:12px}
.mode:before{content:"";width:7px;height:7px;border-radius:50%;background:#bee2b9}
main{max-width:1220px;margin:auto;padding:28px 30px 64px}
.workspace{display:grid;grid-template-columns:minmax(245px,305px) minmax(0,1fr);gap:24px;align-items:start}
section,aside{min-width:0}
.panel,.card,.empty{background:var(--paper);border:1px solid var(--line);border-radius:15px}
.panel{padding:20px}
h2{font-size:22px;line-height:1.2;letter-spacing:-.025em}
aside h2{font-size:19px;margin-bottom:17px}
label{display:block;font-weight:650;font-size:13px;margin:14px 0 5px}
input,textarea{display:block;width:100%;padding:8px 10px;border:1px solid #becbc1;border-radius:7px;background:#fbfcfb;color:var(--ink);min-height:40px}
textarea{resize:vertical}
.hint,.meta{color:var(--soft);font-size:13px}
.hint{margin-top:5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.action{border:1px solid var(--line);background:white;color:var(--green);border-radius:7px;padding:8px 12px;font-weight:650}
.primary{background:var(--green);border-color:var(--green);color:white}
.actions .primary{flex:1}
.overview{display:flex;justify-content:space-between;align-items:start;gap:10px;margin:2px 0 14px}
.overview .meta{margin-top:5px}
.notice{background:var(--sand);color:var(--warn);border-radius:8px;padding:9px 12px;margin:0 0 12px;font-size:13px}
.source-strip{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.pill{display:inline-block;font-size:12px;font-weight:650;border-radius:30px;padding:4px 9px;background:var(--mint);color:#305344}
.pill.warn{background:var(--sand);color:var(--warn)}
.card{padding:19px 20px;margin-bottom:14px}
.card h3{font-size:20px;line-height:1.4;margin:10px 0 14px;letter-spacing:-.015em}
.evidence{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.source{background:#f7f9f6;border:1px solid #e3e9e1;border-radius:8px;padding:11px;overflow-wrap:anywhere}
.source summary{cursor:pointer;font-weight:650;line-height:1.4}
.source p{margin-top:8px;font-size:13px}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 15px;margin:15px 0 0}
.details dt{font-size:12px;font-weight:750;color:var(--green)}
.details dd{margin:3px 0 0;font-size:13px}
.empty{padding:20px}
.records{margin-top:16px}
.records>summary{cursor:pointer;font-weight:650;color:var(--green)}
.record-grid{margin-top:10px}
[hidden]{display:none!important}
@media(max-width:760px){.workspace{grid-template-columns:1fr}.mast-inner{align-items:start}.mast-inner,main{padding-left:17px;padding-right:17px}}
@media(max-width:480px){.evidence,.details{grid-template-columns:1fr}.mast-inner{display:block}.mode{margin-top:15px}}
</style>
</head>
<body>
<header class="mast"><div class="mast-inner">
  <div><h1>BioMastermind</h1><p>Find new public evidence for an open question in plant gene expression.</p></div>
  <span id="mode" class="mode">Loading</span>
</div></header>
<main class="workspace">
  <aside class="panel"><h2>Research watch</h2>
    <form id="watch">
      <label for="question">Research question</label>
      <textarea id="question" required maxlength="500" rows="4" aria-describedby="question-hint"></textarea>
      <p id="question-hint" class="hint">Stored locally with your scans.</p>
      <label for="terms">Public search terms</label>
      <input id="terms" required aria-describedby="terms-hint">
      <p id="terms-hint" class="hint">Comma-separated. The first two terms go to the public repositories.</p>
      <label for="days">Lookback in days</label>
      <input id="days" type="number" min="1" max="365" required>
      <label for="model">Local Ollama model <span class="hint">optional</span></label>
      <input id="model" placeholder="e.g. qwen2.5:7b" maxlength="100">
      <div class="actions"><button class="action primary" id="scan">Run live scan</button><button class="action" id="demo" type="button">View demo</button></div>
      <p id="form-status" class="hint" role="status"></p>
    </form>
  </aside>
  <section aria-labelledby="heading">
    <div class="overview">
      <div><h2 id="heading">Evidence and hypotheses</h2><p class="meta" id="summary"></p></div>
      <button id="export" class="action" hidden>Export JSON</button>
    </div>
    <div id="notices" aria-live="polite"></div>
    <div id="sources" class="source-strip"></div>
    <div id="cards"></div>
    <details class="records" id="records" hidden><summary id="records-title">Source records</summary><div id="records-list" class="evidence record-grid"></div></details>
  </section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const fields = ["question", "terms", "days", "model"];
let report;

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function sourceRecord(record) {
  const item = element("details", "", "source");
  item.append(element("summary", record.title));
  item.append(element("p", [record.source, record.date, record.doi].filter(Boolean).join(" · "), "meta"));
  item.append(element("p", record.text || "No excerpt available in the source metadata."));
  if (record.files.length) item.append(element("p", "Listed files: " + record.files.join(", ")));
  if (record.url) {
    const link = element("a", "Open source ↗");
    const parsed = new URL(record.url);
    if (parsed.protocol === "https:" && ["europepmc.org", "pubmed.ncbi.nlm.nih.gov", "zenodo.org"].includes(parsed.hostname)) {
      link.href = parsed.href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      item.append(element("p"));
      item.lastChild.append(link);
    }
  }
  return item;
}
function hypothesis(card) {
  const item = element("article", "", "card");
  const status = card.new_since_last_scan ? "New candidate · " : "Proposed · ";
  item.append(element("span", status + card.generator, "pill"));
  item.append(element("h3", card.hypothesis));
  const evidence = element("div", "", "evidence");
  evidence.append(sourceRecord(card.paper), sourceRecord(card.dataset));
  item.append(evidence);
  const details = element("dl", "", "details");
  for (const [label, value] of [
    ["Why it surfaced", "Both records mention " + card.matches.join(", ") + "." +
      (card.context?.length ? " Shared terms include " + card.context.join(", ") + "." : "")],
    ["Comparison to run", card.comparison],
    ["What would weaken it", card.would_weaken],
    ["Evidence still needed", card.unresolved],
  ]) {
    const row = element("div");
    row.append(element("dt", label), element("dd", value));
    details.append(row);
  }
  item.append(details);
  return item;
}
function render(state, fillForm) {
  report = state.report;
  if (fillForm) fields.forEach(key => { $(key).value = state.watch[key]; });
  $("mode").textContent = report.mode === "Demo" ? "Offline demo" : "Live scan";
  const count = report.cards.length;
  $("summary").textContent = report.start + " to " + report.end + " · " + count + (count === 1 ? " candidate" : " candidates");
  $("export").hidden = false;
  const messages = report.mode === "Demo" ?
      ["Fictional source records and a sample hypothesis. Run a live scan to query the repositories."] : report.warnings;
  $("notices").replaceChildren(...messages.map(message => element("p", message, "notice")));
  $("sources").replaceChildren(...report.sources.map(entry => {
    const text = entry.status === "OK" ? entry.source + " · " + entry.retrieved + " retrieved of " + entry.available : entry.source + " · unavailable";
    return element("span", text, entry.status === "OK" ? "pill" : "pill warn");
  }));
  $("cards").replaceChildren(...(count ? report.cards.map(hypothesis) :
    [element("p", "No paper–dataset pairs met the matching criteria in this scan.", "empty")]));
  const records = [...report.papers, ...report.datasets];
  $("records").hidden = !records.length;
  $("records-title").textContent = "Retrieved records (" + records.length + ")";
  $("records-list").replaceChildren();
  for (const record of records) $("records-list").append(sourceRecord(record));
}
async function query(path, options) {
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Request failed");
  return data;
}
async function update(action, message, fillForm) {
  $("scan").disabled = $("demo").disabled = true;
  $("form-status").textContent = message;
  try {
    render(await action(), fillForm);
    $("form-status").textContent = "";
  } catch (error) {
    $("form-status").textContent = error.message;
  } finally {
    $("scan").disabled = $("demo").disabled = false;
  }
}
$("watch").addEventListener("submit", event => {
  event.preventDefault();
  const body = Object.fromEntries(fields.map(key => [key, $(key).value]));
  update(() => query("/api/scan", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  }), "Scanning repositories…", true);
});
$("demo").addEventListener("click", () => update(() => query("/api/demo"), "Loading demo…", false));
$("export").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], {type: "application/json"}));
  const anchor = element("a");
  anchor.href = url;
  anchor.download = "biomastermind-" + report.mode.toLowerCase() + "-" + report.end + ".json";
  anchor.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
update(() => query("/api/state"), "Loading…", true);
</script>
</body>
</html>
